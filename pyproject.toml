[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tateyomi"
dynamic = ["version"]
description = "電子書籍を縦書き（右から左）に変換するツール"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7",
    "ebooklib>=0.18",
    "lxml>=5.1",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "pypdf>=4.2",
    "weasyprint>=62.0",
    "Pillow>=10.3",
    "pydantic>=2.6",
    "python-docx>=1.1",
    "chardet>=5.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "authlib>=1.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "itsdangerous>=2.1",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
publish = [
    "build>=1.2",
    "twine>=5.0",
]

[tool.pytest.ini_options]
addopts = "--cov=tateyomi --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=60"
testpaths = ["tests"]

[tool.coverage.run]
source = ["tateyomi"]
omit = ["tateyomi/gui.py", "tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[project.scripts]
tateyomi = "tateyomi.cli:app"
tateyomi-gui = "tateyomi.gui:main"

[tool.setuptools.dynamic]
version = {attr = "tateyomi.__version__"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "W291", "W293"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tateyomi*"]

[tool.setuptools.package-data]
tateyomi = ["assets/*.css", "web/templates/*.html", "web/static/*"]

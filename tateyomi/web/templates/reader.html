<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>{{ title }} — tateyomi Reader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #f5f0e8;
      font-family: "Hiragino Mincho ProN", "游明朝", "Yu Mincho", serif;
      color: #1a1a1a;
    }

    /* ── レイアウト ── */
    .reader-layout {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* ── ヘッダー ── */
    .reader-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      background: rgba(245,240,232,0.97);
      border-bottom: 1px solid #d4c9b0;
      flex-shrink: 0;
      gap: 0.5rem;
    }
    .reader-title {
      font-size: 0.85rem;
      color: #555;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      text-align: center;
    }
    .header-btn {
      text-decoration: none;
      color: #3d5a80;
      font-size: 0.85rem;
      padding: 0.3rem 0.6rem;
      border: 1px solid #3d5a80;
      border-radius: 4px;
      white-space: nowrap;
    }
    .reader-progress {
      font-size: 0.8rem;
      color: #888;
      white-space: nowrap;
    }

    /* ── 縦書き読書エリア ── */
    .reader-body {
      flex: 1;
      overflow-x: scroll;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      padding: 1.5rem 2rem;
    }

    /* 縦書きコンテンツ */
    .chapter-content {
      writing-mode: vertical-rl;
      -webkit-writing-mode: vertical-rl;
      text-orientation: mixed;
      height: 100%;
      line-height: 1.6;
      font-size: 1.05rem;
      white-space: nowrap;
    }

    .chapter-content p {
      display: inline-block;
      white-space: normal;
      vertical-align: top;
      max-height: 100%;
      margin-inline-start: 1.5em;
      text-indent: 1em;
    }

    /* TCY（縦中横） */
    .chapter-content .tcy,
    .chapter-content .tate-chu-yoko {
      text-combine-upright: all;
      -webkit-text-combine: horizontal;
    }

    /* ── フッター ── */
    .reader-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      background: rgba(245,240,232,0.97);
      border-top: 1px solid #d4c9b0;
      flex-shrink: 0;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 1.2rem;
      background: #3d5a80;
      color: #fff;
      border-radius: 6px;
      font-size: 0.9rem;
      text-decoration: none;
      min-width: 90px;
      justify-content: center;
    }
    .nav-btn.ghost {
      background: transparent;
      color: #bbb;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
<div class="reader-layout">

  <header class="reader-header">
    <a class="header-btn" href="/convert">← 一覧</a>
    <span class="reader-title">{{ title }}</span>
    <span class="reader-progress">{{ chapter + 1 }}/{{ total }}章</span>
  </header>

  <div class="reader-body" id="readerBody">
    <div class="chapter-content" id="chapterContent">
      {{ content | safe }}
    </div>
  </div>

  <footer class="reader-footer">
    {% if prev is not none %}
      <a class="nav-btn" href="/read/{{ conv_id }}?chapter={{ prev }}">◀ 前の章</a>
    {% else %}
      <span class="nav-btn ghost">◀ 前の章</span>
    {% endif %}

    <span style="font-size:.8rem;color:#888;">{{ chapter + 1 }} / {{ total }}</span>

    {% if next is not none %}
      <a class="nav-btn" href="/read/{{ conv_id }}?chapter={{ next }}">次の章 ▶</a>
    {% else %}
      <span class="nav-btn ghost">次の章 ▶</span>
    {% endif %}
  </footer>

</div>

<script>
// スワイプでページ送り
let startX = 0, startY = 0;
const body = document.getElementById('readerBody');

body.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
}, {passive: true});

body.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - startX;
  const dy = e.changedTouches[0].clientY - startY;
  // 縦スクロール中は章送りしない
  if (Math.abs(dy) > Math.abs(dx)) return;
  // スクロール中の章送りを防ぐ（端まで来たら章送り）
  const atRight = body.scrollLeft <= 0;
  const atLeft  = body.scrollLeft >= body.scrollWidth - body.clientWidth - 10;
  if (dx > 60 && atRight) {
    {% if prev is not none %}location.href='/read/{{ conv_id }}?chapter={{ prev }}';{% endif %}
  } else if (dx < -60 && atLeft) {
    {% if next is not none %}location.href='/read/{{ conv_id }}?chapter={{ next }}';{% endif %}
  }
}, {passive: true});

// キーボード
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') {% if prev is not none %}location.href='/read/{{ conv_id }}?chapter={{ prev }}';{% else %}void 0;{% endif %}
  if (e.key === 'ArrowLeft')  {% if next is not none %}location.href='/read/{{ conv_id }}?chapter={{ next }}';{% else %}void 0;{% endif %}
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}tateyomi{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
  <header>
    <nav class="navbar">
      <a class="brand" href="/">📖 tateyomi</a>
      <div class="nav-right">
        {% if user %}
          <img class="avatar" src="{{ user.picture }}" alt="{{ user.name }}" referrerpolicy="no-referrer"/>
          <span class="username">{{ user.name }}</span>
          <a class="btn btn-outline" href="/logout">ログアウト</a>
        {% else %}
          <a class="btn btn-google" href="/login">
            <svg width="18" height="18" viewBox="0 0 48 48" style="vertical-align:middle;margin-right:6px">
              <path fill="#4285F4" d="M47.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h13.2c-.6 3-2.3 5.5-4.9 7.2v6h7.9c4.6-4.3 7.3-10.6 7.3-17.2z"/>
              <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.9-6c-2.1 1.4-4.8 2.3-8 2.3-6.1 0-11.3-4.1-13.2-9.7H2.6v6.2C6.5 42.5 14.7 48 24 48z"/>
              <path fill="#FBBC05" d="M10.8 28.8c-.5-1.4-.7-2.9-.7-4.8s.3-3.3.7-4.8v-6.2H2.6C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l8.2-6z"/>
              <path fill="#EA4335" d="M24 9.5c3.4 0 6.5 1.2 8.9 3.5l6.7-6.7C35.9 2.4 30.5 0 24 0 14.7 0 6.5 5.5 2.6 13.2l8.2 6.2c1.9-5.6 7.1-9.9 13.2-9.9z"/>
            </svg>
            Google でログイン
          </a>
        {% endif %}
      </div>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>tateyomi &copy; 2026 — 電子書籍縦書き変換ツール</p>
  </footer>
</body>
</html>
